    <script>
      // Make window.fetch writable to prevent "Cannot set property fetch of #<Window> which has only a getter"
      // when running inside sandboxed iframes, preview wrappers, or extensions
      (function() {
        try {
          var nativeFetch = typeof window !== 'undefined' && typeof window.fetch === 'function'
            ? window.fetch.bind(window)
            : undefined;
          var currentFetch = nativeFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && (!desc.set || !desc.writable)) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  }
                });
              }
            } catch (eProto) {}
          }

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                }
              });
            } catch (eWin) {
              try {
                window.fetch = currentFetch;
              } catch (_) {}
            }
          }
        } catch (err) {}
      })();
    </script>
